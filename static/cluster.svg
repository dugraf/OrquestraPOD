<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 162" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sala de servidores: nodo Master conectado a tres Workers">
  <style>
    @keyframes blink { 0%, 60% { opacity: 1 } 61%, 100% { opacity: .15 } }
    @keyframes blink2 { 0%, 45% { opacity: 1 } 46%, 100% { opacity: .15 } }
    @keyframes flow { 0% { opacity: 0 } 50% { opacity: 1 } 100% { opacity: 0 } }
    .led-g { fill: #00ff00; animation: blink 1.3s steps(1) infinite; }
    .led-g2 { fill: #00ff00; animation: blink2 0.9s steps(1) infinite; }
    .led-a { fill: #ffd700; animation: blink2 1.7s steps(1) infinite; }
    .led-r { fill: #ff5555; animation: blink 2.1s steps(1) infinite; }
    .pkt { fill: #00ffff; animation: flow 1.6s steps(1) infinite; }
    .pkt2 { fill: #00ffff; animation: flow 1.6s steps(1) infinite; animation-delay: .5s; }
    .pkt3 { fill: #00ffff; animation: flow 1.6s steps(1) infinite; animation-delay: 1s; }
    text { font-family: "Lucida Console", "Courier New", monospace; }
  </style>

  <!-- fundo: sala / parede -->
  <rect x="0" y="0" width="320" height="150" fill="#0a3d3d"/>
  <rect x="0" y="0" width="320" height="150" fill="#0a3d3d"/>
  <!-- piso -->
  <rect x="0" y="120" width="320" height="30" fill="#072e2e"/>
  <!-- ladrilhos do piso -->
  <g fill="#0e4747">
    <rect x="0" y="120" width="320" height="1"/>
    <rect x="40" y="120" width="1" height="30"/>
    <rect x="120" y="120" width="1" height="30"/>
    <rect x="200" y="120" width="1" height="30"/>
    <rect x="280" y="120" width="1" height="30"/>
  </g>

  <!-- ================= MASTER (topo central) ================= -->
  <!-- coroa (master = cerebro do cluster) -->
  <g>
    <rect x="146" y="6"  width="28" height="6" fill="#ffd700"/>
    <rect x="146" y="2"  width="4"  height="6" fill="#ffd700"/>
    <rect x="158" y="0"  width="4"  height="8" fill="#ffd700"/>
    <rect x="170" y="2"  width="4"  height="6" fill="#ffd700"/>
    <rect x="151" y="4"  width="2"  height="2" fill="#ff8c00"/>
    <rect x="159" y="2"  width="2"  height="2" fill="#ff8c00"/>
    <rect x="167" y="4"  width="2"  height="2" fill="#ff8c00"/>
  </g>
  <!-- gabinete do master -->
  <rect x="138" y="16" width="44" height="40" fill="#c0c0c0"/>
  <rect x="138" y="16" width="44" height="2"  fill="#ffffff"/>
  <rect x="138" y="16" width="2"  height="40" fill="#ffffff"/>
  <rect x="180" y="16" width="2"  height="40" fill="#404040"/>
  <rect x="138" y="54" width="44" height="2"  fill="#404040"/>
  <!-- tela do master -->
  <rect x="144" y="22" width="32" height="20" fill="#000080"/>
  <rect x="146" y="24" width="28" height="16" fill="#0a0a40"/>
  <text x="160" y="33" fill="#00ff00" font-size="6" text-anchor="middle">MASTER</text>
  <text x="160" y="39" fill="#00ff00" font-size="5" text-anchor="middle">scheduler</text>
  <!-- leds do master -->
  <rect x="146" y="46" width="3" height="3" class="led-g"/>
  <rect x="152" y="46" width="3" height="3" class="led-a"/>
  <rect x="158" y="46" width="3" height="3" class="led-g2"/>
  <text x="160" y="64" fill="#cfe8e8" font-size="6" text-anchor="middle">no MASTER</text>

  <!-- ================= cabos master -> workers ================= -->
  <g stroke="#1a6e6e" stroke-width="2" fill="none">
    <path d="M150 56 L150 80 L52 80 L52 92"/>
    <path d="M160 56 L160 92"/>
    <path d="M170 56 L170 80 L268 80 L268 92"/>
  </g>
  <!-- pacotes (PODs) viajando pelos cabos -->
  <rect x="49" y="84" width="6" height="4" class="pkt"/>
  <rect x="157" y="70" width="6" height="4" class="pkt2"/>
  <rect x="265" y="84" width="6" height="4" class="pkt3"/>

  <!-- ================= RACKS (workers) ================= -->
  <!-- macro: cada rack desenhado por translacao -->
  <!-- WORKER-CPU -->
  <g transform="translate(28,92)">
    <rect x="0" y="0" width="48" height="50" fill="#808080"/>
    <rect x="0" y="0" width="48" height="2" fill="#dfdfdf"/>
    <rect x="0" y="0" width="2" height="50" fill="#dfdfdf"/>
    <rect x="46" y="0" width="2" height="50" fill="#202020"/>
    <rect x="0" y="48" width="48" height="2" fill="#202020"/>
    <!-- unidades 1U -->
    <g>
      <rect x="4" y="6"  width="40" height="6" fill="#303030"/>
      <rect x="4" y="14" width="40" height="6" fill="#303030"/>
      <rect x="4" y="22" width="40" height="6" fill="#303030"/>
      <rect x="4" y="30" width="40" height="6" fill="#303030"/>
      <rect x="4" y="38" width="40" height="6" fill="#303030"/>
    </g>
    <!-- leds -->
    <rect x="7" y="8"  width="2" height="2" class="led-g"/>
    <rect x="7" y="16" width="2" height="2" class="led-g2"/>
    <rect x="7" y="24" width="2" height="2" class="led-g"/>
    <rect x="7" y="32" width="2" height="2" class="led-a"/>
    <rect x="7" y="40" width="2" height="2" class="led-g2"/>
    <!-- pod empilhado -->
    <rect x="34" y="8"  width="6" height="4" fill="#00bcd4"/>
    <rect x="34" y="16" width="6" height="4" fill="#8e44ad"/>
  </g>
  <text x="52" y="159" fill="#cfe8e8" font-size="7" text-anchor="middle">worker-cpu</text>

  <!-- WORKER-DISK -->
  <g transform="translate(136,92)">
    <rect x="0" y="0" width="48" height="50" fill="#808080"/>
    <rect x="0" y="0" width="48" height="2" fill="#dfdfdf"/>
    <rect x="0" y="0" width="2" height="50" fill="#dfdfdf"/>
    <rect x="46" y="0" width="2" height="50" fill="#202020"/>
    <rect x="0" y="48" width="48" height="2" fill="#202020"/>
    <g>
      <rect x="4" y="6"  width="40" height="6" fill="#303030"/>
      <rect x="4" y="14" width="40" height="6" fill="#303030"/>
      <rect x="4" y="22" width="40" height="6" fill="#303030"/>
      <rect x="4" y="30" width="40" height="6" fill="#303030"/>
      <rect x="4" y="38" width="40" height="6" fill="#303030"/>
    </g>
    <rect x="7" y="8"  width="2" height="2" class="led-g2"/>
    <rect x="7" y="16" width="2" height="2" class="led-g"/>
    <rect x="7" y="24" width="2" height="2" class="led-a"/>
    <rect x="7" y="32" width="2" height="2" class="led-g2"/>
    <rect x="7" y="40" width="2" height="2" class="led-g"/>
    <rect x="34" y="8"  width="6" height="4" fill="#f39c12"/>
    <rect x="34" y="16" width="6" height="4" fill="#e67e22"/>
    <rect x="34" y="24" width="6" height="4" fill="#f39c12"/>
  </g>
  <text x="160" y="159" fill="#cfe8e8" font-size="7" text-anchor="middle">worker-disk</text>

  <!-- WORKER-EDGE -->
  <g transform="translate(244,92)">
    <rect x="0" y="0" width="48" height="50" fill="#808080"/>
    <rect x="0" y="0" width="48" height="2" fill="#dfdfdf"/>
    <rect x="0" y="0" width="2" height="50" fill="#dfdfdf"/>
    <rect x="46" y="0" width="2" height="50" fill="#202020"/>
    <rect x="0" y="48" width="48" height="2" fill="#202020"/>
    <g>
      <rect x="4" y="6"  width="40" height="6" fill="#303030"/>
      <rect x="4" y="14" width="40" height="6" fill="#303030"/>
      <rect x="4" y="22" width="40" height="6" fill="#303030"/>
      <rect x="4" y="30" width="40" height="6" fill="#303030"/>
      <rect x="4" y="38" width="40" height="6" fill="#303030"/>
    </g>
    <rect x="7" y="8"  width="2" height="2" class="led-g"/>
    <rect x="7" y="16" width="2" height="2" class="led-g2"/>
    <rect x="7" y="24" width="2" height="2" class="led-g"/>
    <rect x="7" y="32" width="2" height="2" class="led-g2"/>
    <rect x="7" y="40" width="2" height="2" class="led-r"/>
    <rect x="34" y="8"  width="6" height="4" fill="#2ecc71"/>
    <!-- antena (edge = baixa latencia) -->
    <rect x="22" y="-8" width="2" height="8" fill="#dfdfdf"/>
    <rect x="18" y="-10" width="10" height="2" fill="#dfdfdf"/>
    <rect x="14" y="-12" width="2" height="2" class="led-g2"/>
    <rect x="30" y="-12" width="2" height="2" class="led-g2"/>
  </g>
  <text x="268" y="159" fill="#cfe8e8" font-size="7" text-anchor="middle">worker-edge</text>
</svg>
